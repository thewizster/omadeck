name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita systemd-libs fontconfig git github-cli
      - uses: actions/checkout@v7
      - name: Tag must match the Cargo version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo version $version"; exit 1; }
      - run: cargo test --locked
      - name: Build release tarball
        run: scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/SHA256SUMS dist/PKGBUILD-omadeck-bin \
            --title "omadeck $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag
